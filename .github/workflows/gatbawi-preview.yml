name: Create Facebook Gatbawi preview image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gatbawi-preview.yml'
permissions:
  contents: write
jobs:
  create-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate accessible 1200 x 630 Facebook preview JPEG
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          source=Path("Gatbawi/퀼트 산사에서 맞이한 평온한 아침.png")
          with Image.open(source) as im:
              image=ImageOps.fit(im.convert("RGB"),(1200,630),method=Image.Resampling.LANCZOS,centering=(0.5,0.45))
          for folder in (Path("Gatbawi"),Path("docs/Gatbawi")):
              folder.mkdir(parents=True,exist_ok=True)
              image.save(folder/"gatbawi-facebook-preview.jpg",format="JPEG",quality=85,optimize=True,progressive=True)
              print(folder/"gatbawi-facebook-preview.jpg",(folder/"gatbawi-facebook-preview.jpg").stat().st_size)
          PY
      - name: Commit generated preview images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gatbawi/gatbawi-facebook-preview.jpg docs/Gatbawi/gatbawi-facebook-preview.jpg
          git commit -m "Add optimized Facebook preview images for Gatbawi" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
