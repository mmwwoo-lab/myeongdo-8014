name: Deploy Myeongdo 8014 Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout static site
        uses: actions/checkout@v4
      - name: Validate required entry points
        run: |
          node tests/check-site.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
