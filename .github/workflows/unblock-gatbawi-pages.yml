name: Unblock Gatbawi Pages publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unblock-gatbawi-pages.yml']
permissions:
  contents: read
  pages: write
jobs:
  unblock:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stalled Pages deployment before new animated face release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/e8e622b444a2679599e7defe2964a1fe8f106987/cancel" || echo "No cancellable deployment remains"
          gh api "repos/${{ github.repository }}/pages" --jq '{status,source}'
