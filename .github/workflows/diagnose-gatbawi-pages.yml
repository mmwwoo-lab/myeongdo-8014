name: Verify Gatbawi Pages public URL
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-gatbawi-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify root and Gatbawi page after Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq '{html_url, status, source}'
          url="https://mmwwoo-lab.github.io/myeongdo-8014/Gatbawi/index.html"
          echo "Checking $url"
          for attempt in $(seq 1 24); do
            code=$(curl -L -s -o /tmp/page.html -w '%{http_code}' --max-time 18 "$url")
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ] && grep -q '팔공산 갓바위 부처님' /tmp/page.html; then
              echo "PASS: live Gatbawi page is published"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Gatbawi public URL still unavailable"
          exit 1
