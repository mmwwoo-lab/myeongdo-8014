<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>팔공산 갓바위 부처님 | 명도재 소원 기도</title>
<meta name="description" content="팔공산 갓바위 부처님께 일반 소원과 대학진학 소원을 올리고 기도문을 읽어주는 명도재 디지털 기도 공간">
<meta property="og:title" content="팔공산 갓바위 부처님 | 명도재 소원 기도">
<style>
:root{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#fff2dc;background:#142b34}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0,#3b5e63,#142b34 75%);min-height:100vh}
header{max-width:1250px;margin:auto;padding:20px 17px 12px}h1{font-size:clamp(24px,3.5vw,37px);margin:0 0 5px;color:#f7d4a1}header p{font-size:13px;margin:0;color:#c9d9d7}
main{max-width:1250px;margin:auto;padding:12px 17px 26px;display:grid;grid-template-columns:minmax(0,1fr) 320px;align-items:start;gap:16px}
.scene{position:relative;border:2px solid #dabd91;border-radius:18px;overflow:hidden;background:#173740;aspect-ratio:16/10;min-width:0;box-shadow:0 15px 42px #0005}
.scene>img{width:100%;height:100%;object-fit:cover;display:block}
.summit-prayer{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:92%;border-radius:24px;background:#193840ee;color:#ffe8bd;padding:9px 15px;font-size:13px;text-align:center;border:1px solid #debf8a;pointer-events:none}
.prayer-card{position:absolute;right:1.7%;top:8%;width:min(41%,355px);max-height:76%;overflow:auto;background:linear-gradient(135deg,#183a44f5,#315254f5);padding:16px;border-radius:16px;border:1px solid #ead09e;box-shadow:0 10px 30px #09222a99}
.prayer-card[hidden]{display:none!important}.prayer-card h3{font-size:16px;line-height:1.4;color:#f5d6a5;margin:0 0 10px}.prayer-card p{font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;margin:11px 0 0}
.tts-controls{display:flex;flex-wrap:wrap;gap:5px}.tts-controls button{padding:8px 9px;font-size:11px}.tts-status{font-size:11px;color:#f0dac0;margin-top:7px}
.side{display:flex;flex-direction:column}.panel{border:1px solid #d9c4a277;border-radius:16px;padding:18px;background:#23424bb5}
.panel h2{font-size:19px;margin:0 0 12px;color:#f5d6a7}
.panel h3{font-size:16px;color:#f8dcae;margin:0 0 10px}
textarea,input{width:100%;border:1px solid #d1b48b;border-radius:10px;background:#132f37;color:#fff5e6;padding:12px;font:inherit;font-size:14px}
textarea{resize:vertical;min-height:88px}input{margin-bottom:9px}.panel label{display:block;font-size:12px;color:#e8d9bf;margin:8px 0 5px}
button{cursor:pointer;border-radius:10px;border:1px solid #d2b991;background:#284950;color:#fff1d7;padding:11px 12px;font:inherit;font-size:13px;font-weight:700}
button:hover{background:#416a70}button:focus-visible{outline:3px solid #ffdf91;outline-offset:2px}.primary{background:#f0d29f;color:#1a3d46}.primary:hover{background:#ffe4b4}
.full{width:100%;margin-top:9px}.admission-wish{margin-top:18px;padding-top:16px;border-top:1px solid #dfcba37c}
.admission-help{font-size:11px;line-height:1.6;color:#ddcfb9;margin:10px 0 0}
footer{max-width:1250px;margin:auto;text-align:center;font-size:11px;color:#bdd0d1;padding:5px 16px 25px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#112a30ed;color:#ffe7c0;border:1px solid #e0be83;border-radius:24px;padding:12px 20px;z-index:20;text-align:center;max-width:90vw}
@media(max-width:880px){main{grid-template-columns:1fr}.side{max-width:100%}.scene{aspect-ratio:16/10}.prayer-card{width:min(42%,350px)}}
@media(max-width:550px){header{padding:15px}.scene{aspect-ratio:4/5}.prayer-card{right:6px;top:5%;width:60%;max-height:82%;padding:10px}.prayer-card h3{font-size:13px}.prayer-card p{font-size:12px;line-height:1.55}.tts-controls button{padding:7px;font-size:10px}.summit-prayer{font-size:11px;bottom:10px}}
</style></head>
<body>
<header><h1>🪷 팔공산 갓바위 부처님</h1><p>명도재 이명우 · 소원 기도</p></header>
<main>
<section class="scene" aria-label="팔공산 갓바위 부처님 기도 그림">
<img src="./퀼트 산사에서 맞이한 평온한 아침.png" alt="팔공산 갓바위 부처님 앞에서 기도하는 가족들" onerror="this.alt='이미지를 불러오지 못했습니다';">
<div class="summit-prayer" id="summitPrayer">🙏 팔공산 갓바위 부처님께 기도합니다</div>
<section id="prayerCard" class="prayer-card" aria-label="소원 기도문" hidden>
<h3 id="prayerHeading">🪷 팔공산 갓바위 부처님 소원 기도문</h3>
<div class="tts-controls"><button id="readPrayer" type="button">🔊 읽어주기</button><button id="stopPrayer" type="button">■ 정지</button><button id="hidePrayer" type="button">✕ 사라지기</button></div>
<div class="tts-status" id="prayerAudioStatus" role="status" aria-live="polite">읽어주기를 눌러보세요.</div>
<p id="prayerText"></p>
</section>
</section>
<aside class="side"><section class="panel">
<h2>🌸 마음에 담는 소원</h2>
<label for="wish">소원</label><textarea id="wish" maxlength="300" placeholder="소원을 적어 주세요."></textarea>
<button id="wishBtn" type="button" class="primary full">소원 기도 올리기</button>
<div class="admission-wish"><h3>🎓 대학진학 소원</h3>
<label for="admissionName">수험생 이름 (선택)</label><input id="admissionName" maxlength="20" placeholder="이름">
<label for="admissionSchool">희망 대학·학과 (선택)</label><input id="admissionSchool" maxlength="70" placeholder="희망 대학·학과">
<label for="admissionWish">대학진학 소원</label><textarea id="admissionWish" maxlength="300" placeholder="대학진학 소원을 적어 주세요."></textarea>
<button id="admissionBtn" type="button" class="primary full">대학진학 소원 올리기</button>
<p class="admission-help">수험생의 노력과 꿈을 응원합니다.</p>
</div></section></aside>
</main>
<footer>© 명도재 이명우 · 비공식 창작 기도 체험</footer>
<script>
(function(){
const $=id=>document.getElementById(id);
function toast(message){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}
function createWishMessage(wish){
 const clean=wish.replace(/\s+/g,' ').trim();
 const themes=[
  {re:/건강|질병|병원|치료|수술|회복|아프|쾌유|무병/,text:'아픈 몸과 지친 마음에 평안이 깃들고, 필요한 돌봄과 치료의 인연이 이어지기를 발원합니다.'},
  {re:/시험|합격|공부|취업|진학|수능|학업/,text:'배우고 준비하는 매 순간에 지혜와 집중력이 함께하고, 쌓아 온 노력이 뜻깊은 결실로 이어지기를 발원합니다.'},
  {re:/가족|부모|아버지|어머니|자녀|손주|아이|남편|아내/,text:'사랑하는 가족이 서로를 아끼고 보듬으며, 날마다 건강과 따뜻한 웃음을 나누기를 발원합니다.'},
  {re:/사업|돈|재물|직장|경제|빚|장사/,text:'삶의 무게를 감당할 지혜와 용기가 생기고, 정직한 노력에 좋은 기회와 든든한 인연이 함께하기를 발원합니다.'},
  {re:/불안|걱정|슬픔|외로|힘들|우울|두려|상처/,text:'근심은 조금씩 가벼워지고, 지친 마음에 쉼과 위로가 찾아오며, 스스로를 아끼는 힘이 자라기를 발원합니다.'},
  {re:/사랑|인연|결혼|화해|친구|관계/,text:'서로의 마음을 존중하는 인연을 만나고, 미움보다 이해를, 다툼보다 따뜻한 대화를 선택하기를 발원합니다.'}
 ];
 const theme=themes.find(x=>x.re.test(clean));
 // 내용 중 핵심을 짧게 인용하되 전체 기도문은 200자 이내로 유지합니다.
 const subject=clean.length>37?clean.slice(0,37).replace(/[\s,.;]+$/,'')+'…':clean;
 const intro='팔공산 갓바위 부처님 전에 두 손 모아 발원합니다. ';
 const personal='“'+subject+'”라는 간절한 마음을 올립니다. ';
 const middle=theme?theme.text:'소중히 품은 바람을 향해 바른 마음과 작은 실천을 이어 갈 지혜와 용기를 발원합니다.';
 const close=' 모든 생명이 평안하고, 오늘의 선한 마음이 내일의 희망이 되게 하소서. 나무아미타불.';
 const available=200-intro.length-personal.length-close.length;
 return intro+personal+middle.slice(0,Math.max(0,available))+close;
}
let currentUtterance=null;
function stopPrayerSpeech(){
 if('speechSynthesis' in window)window.speechSynthesis.cancel();
 currentUtterance=null;
 $('readPrayer').textContent='🔊 기도문 읽어주기';
 $('prayerAudioStatus').textContent='읽어주기 버튼을 눌러 기도문을 들어보세요.';
}
function speakPrayer(){
 if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
 $('prayerAudioStatus').textContent='이 브라우저에서는 음성 읽기를 지원하지 않습니다. Chrome 또는 Edge를 이용해 주세요.';return;
 }
 const synth=window.speechSynthesis;
 if(synth.speaking && !synth.paused){synth.pause();$('readPrayer').textContent='▶ 이어 읽기';$('prayerAudioStatus').textContent='낭독 일시정지';return;}
 if(synth.paused){synth.resume();$('readPrayer').textContent='⏸ 잠시 멈춤';$('prayerAudioStatus').textContent='기도문 낭독 중';return;}
 const text=$('prayerText').textContent.trim();
 if(!text)return;
 synth.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang='ko-KR';utterance.rate=.87;utterance.pitch=1;utterance.volume=1;
 const koVoices=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ko'));
 if(koVoices.length)utterance.voice=koVoices.find(v=>/female|woman|여성|sunhi|yuna|heami/i.test(v.name))||koVoices[0];
 currentUtterance=utterance;
 utterance.onstart=()=>{if(currentUtterance===utterance){$('readPrayer').textContent='⏸ 잠시 멈춤';$('prayerAudioStatus').textContent='기도문 낭독 중';}};
 utterance.onend=()=>{if(currentUtterance===utterance)stopPrayerSpeech();};
 utterance.onerror=e=>{if(currentUtterance===utterance){stopPrayerSpeech();if(e.error!=='interrupted'&&e.error!=='canceled')$('prayerAudioStatus').textContent='음성 재생에 실패했습니다. 기기 음성 설정을 확인해 주세요.';}};
 synth.speak(utterance);
}
$('readPrayer').onclick=speakPrayer;
$('stopPrayer').onclick=stopPrayerSpeech;
$('hidePrayer').onclick=()=>{stopPrayerSpeech();$('prayerCard').hidden=true;$('summitPrayer').textContent='🙏 팔공산 갓바위 부처님 앞에서 두 손을 모읍니다';toast('기도문 창을 닫았습니다. 소원을 다시 올리면 새 기도문이 나타납니다.');};
window.addEventListener('pagehide',()=>{if('speechSynthesis' in window)window.speechSynthesis.cancel()});
function showPrayer(message, isAdmission){
 stopPrayerSpeech();
 $('prayerHeading').textContent=isAdmission?'🎓 팔공산 갓바위 부처님 대학진학 기도문':'🪷 팔공산 갓바위 부처님 소원 기도문';
 $('prayerText').textContent=message;
 $('prayerCard').hidden=false;
 $('summitPrayer').textContent=isAdmission?'🎓 수험생의 꿈을 응원합니다.':'🪷 소원 기도문을 올렸습니다.';
 $('prayerCard').scrollIntoView({behavior:'smooth',block:'nearest'});
 toast(isAdmission?'대학진학 기도문을 올렸습니다.':'소원 기도문을 올렸습니다.');
}
function createAdmissionPrayer(name,school,wish){
 const who=(name||'소중한 수험생').replace(/\s+/g,' ').trim().slice(0,16);
 const target=school.replace(/\s+/g,' ').trim().slice(0,35);
 const intention=wish.replace(/\s+/g,' ').trim().slice(0,40);
 const intro='팔공산 갓바위 부처님 전에 간절한 마음을 올립니다. ';
 const person=who+'의 대학진학을 응원합니다. ';
 const goal=target?'희망하는 '+target+' 진학에 좋은 인연이 함께하기를 기원합니다. ':'';
 const detail=intention?'“'+intention+'”라는 소망도 마음에 담습니다. ':'';
 const ending='공부한 만큼 시험과 면접에서 차분히 실력을 펼치고, 자신의 꿈을 향해 힘차게 나아가게 하소서. 나무아미타불.';
 const shortEnding='노력의 결실을 맺고, 용기와 희망으로 새로운 길을 열게 하소서. 나무아미타불.';
 const base=intro+person+goal;
 if((base+detail+ending).length<=200)return base+detail+ending;
 if((base+detail+shortEnding).length<=200)return base+detail+shortEnding;
 if((base+shortEnding).length<=200)return base+shortEnding;
 return (intro+person+'진학의 꿈에 지혜와 평안이 함께하게 하소서. '+shortEnding).slice(0,200);
}
$('wishBtn').onclick=()=>{
 const w=$('wish').value.trim();
 if(!w){toast('마음속 소원을 적어보세요.');$('wish').focus();return;}
 showPrayer(createWishMessage(w),false);
};
$('admissionBtn').onclick=()=>{
 const name=$('admissionName').value.trim(),school=$('admissionSchool').value.trim(),wish=$('admissionWish').value.trim();
 if(!name&&!school&&!wish){toast('대학진학 소원이나 희망 대학을 적어보세요.');$('admissionWish').focus();return;}
 showPrayer(createAdmissionPrayer(name,school,wish),true);
};

})();
</script>
</body></html>
