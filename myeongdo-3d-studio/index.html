<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>명도재 AI 3D 피규어 스튜디오</title><style>body{margin:0;background:#101827;color:#f4f6fc;font-family:system-ui,sans-serif}header{text-align:center;padding:22px;background:#172338}h1{font-size:1.5rem}main{max-width:1100px;margin:auto;padding:20px;display:grid;grid-template-columns:320px 1fr;gap:24px}section{background:#1d2b41;padding:20px;border-radius:16px}label{display:block;margin:14px 0 7px}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #435470;border-radius:9px;background:#111c2e;color:white;font:inherit}button{cursor:pointer;background:#3975e8;border:0;margin-top:12px;font-weight:bold}.secondary{background:#354760}canvas{display:block;width:100%;max-width:650px;aspect-ratio:1;background:#f2f2f2;border-radius:12px;margin:auto}small{color:#b6c5da;line-height:1.6}#status{color:#a8d7ff}@media(max-width:750px){main{grid-template-columns:1fr;padding:12px}section{padding:14px}}</style></head><body><header><h1>명도재 AI 3D 피규어 아트 스튜디오</h1><small>사진 기반 1:1 입체감 아트 · GLB 3D 모델 감상</small></header><main><section><label>① 원본 사진</label><input type="file" id="photo" accept="image/*"><label>② 제작 스타일</label><select id="style"><option value="figure">리얼 피규어</option><option value="toy">컬러 장난감</option><option value="diorama">미니어처 디오라마</option><option value="sculpture">조각상</option></select><label>③ 입체감</label><input id="depth" type="range" min="0" max="100" value="55"><label>④ 작품 제목</label><input id="caption" placeholder="작품 제목 (선택)"><button id="render">1:1 입체 아트 만들기</button><button class="secondary" id="save">PNG 저장 (1024×1024)</button><label>⑤ GLB 3D 모델 불러오기</label><input id="model" type="file" accept=".glb,model/gltf-binary"><small>사진에서 실제 3D 메시를 생성하려면 별도 3D 생성 API가 필요합니다.</small><p id="status" role="status">사진을 업로드해 주세요.</p></section><section><canvas id="canvas" width="1024" height="1024"></canvas><div id="viewer" style="display:none;aspect-ratio:1"></div><small>사진 결과는 그림자·조명·받침대를 합성한 2D 이미지이며, GLB 파일은 실제 3D로 회전 감상할 수 있습니다.</small></section></main><script type="module">
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),$=s=>document.querySelector(s);let photo=null;
function draw(){const w=1024;ctx.clearRect(0,0,w,w);const bg=ctx.createLinearGradient(0,0,w,w);bg.addColorStop(0,'#eaf0f6');bg.addColorStop(1,'#aab6c8');ctx.fillStyle=bg;ctx.fillRect(0,0,w,w);ctx.save();ctx.translate(512,530);const shadow=ctx.createRadialGradient(0,300,10,0,300,370);shadow.addColorStop(0,'#17213270');shadow.addColorStop(1,'#17213200');ctx.fillStyle=shadow;ctx.beginPath();ctx.ellipse(0,300,370,90,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#48546a';ctx.beginPath();ctx.ellipse(0,270,350,85,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d6dce6';ctx.beginPath();ctx.ellipse(0,250,350,85,0,0,Math.PI*2);ctx.fill();if(photo){const scale=Math.min(670/photo.width,650/photo.height),dw=photo.width*scale,dh=photo.height*scale;ctx.shadowColor='#192234aa';ctx.shadowBlur=35;ctx.shadowOffsetX=Number($('#depth').value)*.24;ctx.shadowOffsetY=25;ctx.drawImage(photo,-dw/2,-dh/2-60,dw,dh);ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;const overlay=ctx.createLinearGradient(-dw/2,-dh/2,dw/2,dh/2),style=$('#style').value;if(style==='toy'){overlay.addColorStop(0,'#ffb6d51f');overlay.addColorStop(1,'#4cbcff29')}else if(style==='sculpture'){overlay.addColorStop(0,'#ffffff55');overlay.addColorStop(1,'#55555555')}else if(style==='diorama'){overlay.addColorStop(0,'#ffe4a722');overlay.addColorStop(1,'#6c965522')}else{overlay.addColorStop(0,'#ffffff26');overlay.addColorStop(1,'#00000026')}ctx.fillStyle=overlay;ctx.fillRect(-dw/2,-dh/2-60,dw,dh)}else{ctx.textAlign='center';ctx.fillStyle='#344258';ctx.font='bold 42px system-ui';ctx.fillText('사진을 업로드하세요',0,0)}ctx.restore();const title=$('#caption').value.trim();if(title){ctx.fillStyle='#1a2b40';ctx.font='bold 32px system-ui';ctx.textAlign='center';ctx.fillText(title.slice(0,35),512,945)}}
$('#photo').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){status.textContent='이미지 파일을 선택하세요.';return}const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{photo=img;$('#viewer').style.display='none';canvas.style.display='block';draw();status.textContent='사진을 불러왔습니다.';URL.revokeObjectURL(url)};img.onerror=()=>{status.textContent='사진을 읽을 수 없습니다.';URL.revokeObjectURL(url)};img.src=url};$('#render').onclick=()=>{draw();status.textContent=photo?'1:1 입체감 이미지 완성 (실제 3D 모델 아님)':'사진을 먼저 업로드하세요.'};$('#save').onclick=()=>{draw();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='myeongdo-figure-1024.png';a.click()};['depth','style','caption'].forEach(id=>$('#'+id).addEventListener('input',draw));
$('#model').onchange=async e=>{const f=e.target.files[0];if(!f)return;const viewer=$('#viewer');viewer.style.display='block';canvas.style.display='none';viewer.innerHTML='';try{const THREE=await import('https://esm.sh/three@0.170.0');const {OrbitControls}=await import('https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js');const {GLTFLoader}=await import('https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js');const scene=new THREE.Scene();scene.background=new THREE.Color(0xe8edf5);scene.add(new THREE.HemisphereLight(0xffffff,0x5a6680,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,4);scene.add(light);const camera=new THREE.PerspectiveCamera(45,1,.01,1000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(viewer.clientWidth,viewer.clientWidth);viewer.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement),url=URL.createObjectURL(f);new GLTFLoader().load(url,g=>{scene.add(g.scene);const box=new THREE.Box3().setFromObject(g.scene),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),max=Math.max(size.x,size.y,size.z)||1;controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(max*1.6,max*.9,max*1.6));camera.near=max/100;camera.far=max*100;camera.updateProjectionMatrix();controls.update();status.textContent='3D 모델 로딩 완료: 터치하거나 드래그하여 회전하세요.';URL.revokeObjectURL(url)},undefined,()=>{status.textContent='GLB 파일을 읽지 못했습니다.';URL.revokeObjectURL(url)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)})}catch(err){status.textContent='3D 뷰어 로딩 실패: 인터넷 연결을 확인하세요.'}};draw();</script></body></html>
