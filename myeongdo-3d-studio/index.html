<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>명도재 AI 피규어 스튜디오</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1322;color:#f4f6fa;font-family:system-ui,'Noto Sans KR',sans-serif}header{text-align:center;padding:26px 12px;background:linear-gradient(120deg,#243451,#121c30)}h1{font-size:clamp(22px,4vw,32px);margin:0 0 8px}header p{color:#b9cbe2;margin:0}main{max-width:1150px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:340px 1fr;gap:20px}.panel{background:#1b293e;border:1px solid #35465f;border-radius:18px;padding:20px}label{display:block;margin:15px 0 7px;font-weight:650}input,select,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid #52637a;background:#101c2e;color:#fff}button{background:#3d7af3;border:0;cursor:pointer;font-weight:700;margin-top:12px}button.secondary{background:#3b4c66}button:disabled{opacity:.5;cursor:wait}.preview{border-radius:14px;overflow:hidden;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}canvas{display:block;width:100%;aspect-ratio:1}small{display:block;color:#bac9db;line-height:1.65;margin-top:12px}#status{color:#a9d7ff;white-space:pre-wrap;line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row button{margin-top:12px}@media(max-width:760px){main{grid-template-columns:1fr}.panel{padding:14px}}</style></head><body><header><h1>🎨 명도재 AI 피규어 스튜디오</h1><p>사진 속 주인공만 추출 · 전시 받침대 · 1:1 투명 PNG</p></header><main><section class="panel"><label>① 인물·동물·사물 사진</label><input id="photo" type="file" accept="image/*"><button id="cut">AI로 배경 제거 · 피사체 추출</button><label>② 전시 받침대</label><select id="base"><option value="wood">고급 원목 받침대</option><option value="marble">대리석 받침대</option><option value="black">블랙 전시 받침대</option><option value="none">받침대 없음</option></select><label>③ 피규어 표현</label><select id="style"><option value="real">실물형</option><option value="toy">토이 컬러</option><option value="stone">조각상 톤</option></select><label>④ 입체 그림자 강도</label><input id="depth" type="range" min="0" max="100" value="65"><label>⑤ 명패 문구</label><input id="name" maxlength="24" value="명도재 피규어"><div class="row"><button id="draw" class="secondary">작품 다시 그리기</button><button id="save">PNG 저장</button></div><button id="reset" class="secondary">원본으로 되돌리기</button><p id="status" role="status">사진을 선택하고 배경 제거를 실행하세요.</p><small>정사각형 1024×1024 PNG로 저장됩니다. 투명 배경과 전시 받침대가 포함됩니다. 현재 버전은 피사체를 추출하여 전시용 입체감 합성 이미지를 만드는 기능입니다. 실제 조형 인형으로 다시 생성하거나 360° 회전 가능한 3D 메시를 생성하려면 별도 이미지 생성/3D 생성 API 연동이 필요합니다.</small></section><section class="panel"><div class="preview"><canvas id="art" width="1024" height="1024"></canvas></div><small>체크무늬는 투명 영역 표시이며 PNG 파일에는 포함되지 않습니다.</small></section></main><script type="module">
const $=s=>document.querySelector(s),c=$('#art'),g=c.getContext('2d');let original=null,subject=null,sourceBlob=null,busy=false;
const ellipse=(x,y,rx,ry,fill)=>{g.fillStyle=fill;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()};
function base(){const kind=$('#base').value;if(kind==='none')return;const grad=g.createLinearGradient(0,740,0,965);if(kind==='wood'){grad.addColorStop(0,'#d6a56f');grad.addColorStop(.35,'#94552e');grad.addColorStop(1,'#452315')}else if(kind==='marble'){grad.addColorStop(0,'#ffffff');grad.addColorStop(.4,'#bfc7d0');grad.addColorStop(1,'#707988')}else{grad.addColorStop(0,'#777d89');grad.addColorStop(.35,'#272c34');grad.addColorStop(1,'#0c1017')}g.save();g.shadowColor='#1118';g.shadowBlur=30;g.shadowOffsetY=18;g.fillStyle=grad;g.beginPath();g.moveTo(120,806);g.lineTo(904,806);g.lineTo(874,934);g.quadraticCurveTo(512,1010,150,934);g.closePath();g.fill();g.restore();ellipse(512,806,392,91,grad);ellipse(512,793,371,77,kind==='wood'?'#c58b54':kind==='marble'?'#e3e5e8':'#505866');g.strokeStyle='#ffffff44';g.lineWidth=5;g.beginPath();g.ellipse(512,793,371,77,0,0,Math.PI*2);g.stroke();const name=$('#name').value.trim();if(name){g.fillStyle=kind==='black'?'#bda56a':'#e3b65d';g.beginPath();g.roundRect(315,879,394,62,14);g.fill();g.fillStyle='#24201b';g.font='bold 31px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(name,512,911,360)}}
function draw(){g.clearRect(0,0,1024,1024);const img=subject||original;const hasBase=$('#base').value!=='none';if(img){const maxW=690,maxH=hasBase?690:850,scale=Math.min(maxW/img.width,maxH/img.height),w=img.width*scale,h=img.height*scale,x=(1024-w)/2,y=hasBase?780-h:(1024-h)/2;g.save();const d=Number($('#depth').value),s=$('#style').value;g.filter='drop-shadow('+Math.round(d*.18)+'px '+Math.round(d*.22)+'px '+Math.round(d*.35)+'px rgba(12,19,30,.6))';if(s==='toy')g.filter+=' saturate(1.45) contrast(1.07)';if(s==='stone')g.filter+=' grayscale(.85) contrast(1.12)';g.drawImage(img,x,y,w,h);g.restore()}else{g.fillStyle='#4c5e73';g.font='bold 40px system-ui';g.textAlign='center';g.fillText('사진을 업로드하세요',512,490)}base()}
function load(url){return new Promise((ok,fail)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=fail;i.src=url})}
$('#photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;sourceBlob=f;const u=URL.createObjectURL(f);try{original=await load(u);subject=null;draw();$('#status').textContent='사진 준비 완료. 배경 제거 버튼을 눌러주세요.'}catch{$('#status').textContent='사진을 열 수 없습니다.'}finally{URL.revokeObjectURL(u)}};
$('#cut').onclick=async()=>{if(!sourceBlob){$('#status').textContent='먼저 사진을 업로드하세요.';return}if(busy)return;busy=true;$('#cut').disabled=true;$('#status').textContent='배경 제거 AI 모델 로딩 중… (첫 실행은 다소 오래 걸릴 수 있습니다)';try{const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');const blob=await removeBackground(sourceBlob,{progress:(key,current,total)=>{if(total)$('#status').textContent='AI 처리 중 '+Math.round(current/total*100)+'% · '+key}});const u=URL.createObjectURL(blob);try{subject=await load(u)}finally{URL.revokeObjectURL(u)}draw();$('#status').textContent='피사체 추출 완료. 받침대와 명패를 확인하고 저장하세요.'}catch(e){$('#status').textContent='배경 제거 실패: '+(e.message||'브라우저 또는 네트워크를 확인하세요.')}finally{busy=false;$('#cut').disabled=false}};
['base','style','depth','name'].forEach(k=>$('#'+k).addEventListener('input',draw));$('#draw').onclick=draw;$('#reset').onclick=()=>{subject=null;draw();$('#status').textContent='원본으로 돌아왔습니다.'};$('#save').onclick=()=>{if(!subject){$('#status').textContent='투명 배경 저장을 위해 AI 배경 제거를 먼저 실행하세요.';return}draw();const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='myeongdo-figure-pedestal-1024.png';a.click()};draw();
</script></body></html>
