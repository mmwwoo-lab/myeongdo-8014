<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>명도재 무료 피규어 스튜디오</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f4f6fa;font-family:system-ui,'Noto Sans KR',sans-serif}header{text-align:center;padding:26px 12px;background:#1d2d47}h1{margin:0 0 8px;font-size:clamp(22px,4vw,30px)}main{max-width:1100px;margin:auto;padding:18px;display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{background:#1d2a40;border-radius:16px;padding:20px}label{display:block;margin:15px 0 7px;font-weight:650}input,select,button{font:inherit;width:100%;padding:12px;border-radius:9px;border:1px solid #52617a;background:#101c2d;color:#fff}button{border:0;background:#3978ef;cursor:pointer;margin-top:12px;font-weight:700}button:disabled{opacity:.5;cursor:wait}.secondary{background:#43536c}.preview{background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:1}small{display:block;color:#b7c8db;line-height:1.6;margin-top:12px}#status{white-space:pre-wrap;color:#aed9ff}header p{margin:0;color:#c5d3e4}@media(max-width:740px){main{grid-template-columns:1fr;padding:12px}.panel{padding:14px}}</style></head><body><header><h1>🎨 명도재 무료 피규어 스튜디오</h1><p>API 키 없이 사진 속 주인공을 받침대 위 입체 작품으로</p></header><main><section class="panel"><label>① 사진 업로드</label><input id="photo" type="file" accept="image/*"><button id="cut">✨ 배경 자동 제거</button><label>② 받침대 선택</label><select id="base"><option value="wood">고급 원목</option><option value="marble">대리석</option><option value="black">블랙 전시대</option><option value="none">받침대 없음</option></select><label>③ 피규어 표현</label><select id="style"><option value="real">실물형 입체감</option><option value="toy">컬러 토이</option><option value="stone">조각상 색감</option></select><label>④ 입체 그림자</label><input id="depth" type="range" min="0" max="100" value="60"><label>⑤ 명패 이름</label><input id="name" maxlength="22" value="명도재 피규어"><button id="save">투명 PNG 저장</button><button id="reset" class="secondary">원본 사진으로 되돌리기</button><p id="status" role="status">사진을 업로드하세요.</p><small>별도 OpenAI API 키와 유료 API 호출이 필요 없습니다. 배경 제거 모델은 처음 사용 시 인터넷에서 다운로드됩니다. 사진에서 피사체를 추출하고 입체감을 합성하는 기능이며 실제 3D 모델 생성은 아닙니다.</small></section><section class="panel"><div class="preview"><canvas id="art" width="1024" height="1024"></canvas></div><small>체크무늬는 투명 영역 안내용이며 저장 파일에는 나타나지 않습니다.</small></section></main><script type="module">
const $=s=>document.querySelector(s),c=$('#art'),g=c.getContext('2d');let original=null,subject=null,source=null,busy=false;
function oval(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function pedestal(){let kind=$('#base').value;if(kind==='none')return;const grad=g.createLinearGradient(0,770,0,965);if(kind==='wood'){grad.addColorStop(0,'#d9aa70');grad.addColorStop(.35,'#97592d');grad.addColorStop(1,'#432315')}else if(kind==='marble'){grad.addColorStop(0,'#fff');grad.addColorStop(.4,'#cbd2da');grad.addColorStop(1,'#697684')}else{grad.addColorStop(0,'#7a7e89');grad.addColorStop(.35,'#2c3039');grad.addColorStop(1,'#0b1016')}g.save();g.shadowColor='#0008';g.shadowBlur=30;g.shadowOffsetY=15;g.fillStyle=grad;g.beginPath();g.moveTo(118,808);g.lineTo(906,808);g.lineTo(875,928);g.quadraticCurveTo(512,1002,149,928);g.closePath();g.fill();g.restore();oval(512,806,394,89,grad);oval(512,790,370,74,kind==='wood'?'#c28b53':kind==='marble'?'#e3e6e9':'#505763');g.strokeStyle='#ffffff55';g.lineWidth=4;g.beginPath();g.ellipse(512,790,370,74,0,0,Math.PI*2);g.stroke();let name=$('#name').value.trim();if(name){g.fillStyle='#e0b661';g.beginPath();g.roundRect(309,875,406,60,12);g.fill();g.fillStyle='#29231d';g.font='bold 29px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(name,512,905,375)}}
function render(){g.clearRect(0,0,1024,1024);const img=subject||original,hasBase=$('#base').value!=='none';if(img){const scale=Math.min(710/img.width,(hasBase?680:840)/img.height),w=img.width*scale,h=img.height*scale,x=(1024-w)/2,y=hasBase?778-h:(1024-h)/2,d=Number($('#depth').value);g.save();g.filter='drop-shadow('+Math.round(d*.17)+'px '+Math.round(d*.2)+'px '+Math.round(d*.32)+'px rgba(16,22,32,.6))';if($('#style').value==='toy')g.filter+=' saturate(1.45) contrast(1.09)';if($('#style').value==='stone')g.filter+=' grayscale(.8) contrast(1.12)';g.drawImage(img,x,y,w,h);g.restore()}else{g.fillStyle='#64748b';g.font='bold 35px system-ui';g.textAlign='center';g.fillText('사진을 선택하세요',512,480)}pedestal()}
function load(url){return new Promise((ok,fail)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=fail;i.src=url})}
$('#photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;source=f;const u=URL.createObjectURL(f);try{original=await load(u);subject=null;render();$('#status').textContent='사진을 불러왔습니다. 배경 자동 제거를 누르세요.'}catch{$('#status').textContent='사진을 읽을 수 없습니다.'}finally{URL.revokeObjectURL(u)}};
$('#cut').onclick=async()=>{if(!source){$('#status').textContent='사진을 먼저 업로드하세요.';return}if(busy)return;busy=true;$('#cut').disabled=true;$('#status').textContent='배경 제거 모델을 준비 중입니다. 첫 사용은 다운로드로 시간이 걸릴 수 있습니다.';try{const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');const blob=await removeBackground(source,{progress:(key,current,total)=>{if(total)$('#status').textContent='모델 준비 및 처리: '+Math.round(current/total*100)+'% ('+key+')'}});const u=URL.createObjectURL(blob);try{subject=await load(u)}finally{URL.revokeObjectURL(u)}render();$('#status').textContent='배경 제거 완료! 받침대 위 작품을 저장할 수 있습니다.'}catch(e){$('#status').textContent='배경 제거 실패: '+(e.message||'인터넷 연결 또는 브라우저 호환성을 확인하세요.')}finally{busy=false;$('#cut').disabled=false}};
['base','style','depth','name'].forEach(id=>$('#'+id).addEventListener('input',render));$('#reset').onclick=()=>{subject=null;render();$('#status').textContent='원본으로 복원했습니다.'};$('#save').onclick=()=>{if(!subject){$('#status').textContent='투명 배경으로 저장하려면 먼저 배경 제거를 완료하세요.';return}render();const a=document.createElement('a');a.download='myeongdo-figurine-transparent-1024.png';a.href=c.toDataURL('image/png');a.click()};render();
</script></body></html>
