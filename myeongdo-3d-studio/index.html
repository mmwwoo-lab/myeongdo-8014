<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>명도재 투명 피규어 스튜디오</title><style>body{margin:0;background:#101827;color:#f3f6ff;font-family:system-ui,sans-serif}header{text-align:center;padding:24px 12px;background:#18243a}h1{font-size:1.5rem}main{max-width:1050px;margin:auto;padding:20px;display:grid;grid-template-columns:310px 1fr;gap:20px}section{background:#1c2a40;border-radius:16px;padding:20px}label{display:block;margin:14px 0 7px}input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;background:#101b2d;color:white;border:1px solid #485a76;font:inherit}button{background:#376ee6;border:0;margin-top:12px;cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:wait}.secondary{background:#43536a}.preview{background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:1}small{color:#b6c5dc;line-height:1.6}#status{color:#b3dbff;white-space:pre-wrap}@media(max-width:750px){main{grid-template-columns:1fr;padding:12px}section{padding:14px}}</style></head><body><header><h1>명도재 AI 3D 피규어 아트 스튜디오</h1><small>주 피사체만 남기고 배경을 지우는 1:1 투명 PNG 제작</small></header><main><section><label>① 사진 업로드</label><input id="photo" type="file" accept="image/*"><button id="remove">AI로 배경 제거하기</button><label>② 피규어 입체감</label><input id="depth" type="range" min="0" max="100" value="45"><label>③ 표현 방식</label><select id="style"><option value="figure">리얼 피규어</option><option value="toy">컬러 토이 피규어</option><option value="sculpture">조각상 느낌</option></select><button id="save" class="secondary">투명 PNG 1024×1024 저장</button><button id="reset" class="secondary">원본으로 되돌리기</button><p id="status" role="status">사진을 선택한 다음 ‘AI로 배경 제거하기’를 누르세요.</p><small>첫 실행에는 AI 모델 다운로드로 시간이 걸릴 수 있으며 인터넷 연결이 필요합니다. 이 기능은 배경 분리와 2D 입체감 표현입니다. 실제 3D 메시 생성은 지원하지 않습니다.</small></section><section><div class="preview"><canvas id="canvas" width="1024" height="1024"></canvas></div><p><small>체크무늬는 투명 영역을 표시합니다. 저장되는 PNG에는 체크무늬가 포함되지 않습니다.</small></p></section></main><script type="module">
const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d');let original=null,subject=null,busy=false;
function render(){ctx.clearRect(0,0,1024,1024);const img=subject||original;if(!img)return;const scale=Math.min(820/img.width,820/img.height),w=img.width*scale,h=img.height*scale,x=(1024-w)/2,y=(1024-h)/2;ctx.save();const depth=Number($('#depth').value),style=$('#style').value;ctx.filter='drop-shadow('+Math.round(depth*.22)+'px '+Math.round(depth*.25)+'px '+Math.round(depth*.3)+'px rgba(22,29,45,.42))';if(style==='toy')ctx.filter+=' saturate(1.35) contrast(1.08)';if(style==='sculpture')ctx.filter+=' grayscale(.8) contrast(1.15)';ctx.drawImage(img,x,y,w,h);ctx.restore()}
async function loadImage(src){return await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src})}
$('#photo').onchange=async e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file);try{original=await loadImage(url);subject=null;render();$('#status').textContent='사진을 불러왔습니다. 배경 제거 버튼을 누르세요.'}catch{$('#status').textContent='사진을 읽을 수 없습니다.'}finally{URL.revokeObjectURL(url)}};
$('#remove').onclick=async()=>{if(!original){$('#status').textContent='먼저 사진을 업로드하세요.';return}if(busy)return;busy=true;$('#remove').disabled=true;$('#status').textContent='AI 배경 제거 모델을 불러오고 있습니다. 첫 실행에는 시간이 걸릴 수 있습니다…';try{const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');const source=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!source)throw Error('이미지 변환 실패');const result=await removeBackground(source,{progress:(key,current,total)=>{if(total)$('#status').textContent='배경 분리 처리 중: '+Math.round(current/total*100)+'% ('+key+')'}});const url=URL.createObjectURL(result);try{subject=await loadImage(url)}finally{URL.revokeObjectURL(url)}render();$('#status').textContent='배경 제거 완료! 피사체만 투명 PNG로 저장할 수 있습니다.'}catch(err){$('#status').textContent='자동 배경 제거에 실패했습니다. 브라우저 또는 인터넷 연결을 확인하세요. '+(err?.message||'')}finally{busy=false;$('#remove').disabled=false}};
$('#depth').oninput=render;$('#style').onchange=render;$('#reset').onclick=()=>{subject=null;render();$('#status').textContent='원본으로 복원했습니다.'};$('#save').onclick=()=>{if(!subject){$('#status').textContent='투명 PNG를 저장하려면 먼저 배경 제거를 완료하세요.';return}render();const a=document.createElement('a');a.download='myeongdo-transparent-figure-1024.png';a.href=canvas.toDataURL('image/png');a.click()};render();
</script></body></html>
