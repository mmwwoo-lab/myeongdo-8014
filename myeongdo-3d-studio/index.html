<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>명도재 AI 피규어 스튜디오</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,sans-serif}header{text-align:center;padding:25px;background:#1b2a43}h1{margin:0;font-size:1.6rem}main{max-width:1080px;margin:auto;padding:20px;display:grid;grid-template-columns:320px 1fr;gap:20px}section{padding:20px;background:#1d2b41;border-radius:16px}label{display:block;margin:14px 0 6px}input,select,button{width:100%;padding:12px;background:#111c2d;color:white;border:1px solid #455875;border-radius:10px;font:inherit}button{margin-top:15px;background:#3779f5;cursor:pointer;border:0;font-weight:700}button:disabled{opacity:.55;cursor:wait}.secondary{background:#445570}.preview{aspect-ratio:1;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:30px 30px;background-position:0 0,0 15px,15px -15px,-15px 0;border-radius:12px;overflow:hidden;display:grid;place-items:center}.preview img{width:100%;height:100%;object-fit:contain}small{display:block;color:#b6c6dc;line-height:1.6;margin-top:12px}#status{color:#a9d9ff;white-space:pre-wrap}@media(max-width:750px){main{grid-template-columns:1fr;padding:12px}section{padding:14px}}</style></head><body><header><h1>🎨 명도재 AI 3D 피규어 스튜디오</h1><p>사진 한 장으로 만드는 받침대 위 입체 피규어 이미지</p></header><main><section><label>① 원본 사진</label><input type="file" id="file" accept="image/png,image/jpeg,image/webp"><label>② 피규어 유형</label><select id="style"><option value="real">고급 실물형 피규어</option><option value="toy">귀여운 캐릭터 인형</option><option value="sculpture">조각상 피규어</option></select><label>③ 받침대</label><select id="base"><option value="wood">원목 받침대</option><option value="marble">대리석 받침대</option><option value="black">블랙 받침대</option><option value="none">받침대 없음</option></select><label>④ 명패 이름</label><input id="name" maxlength="24" value="명도재 이명우"><button id="generate">✨ OpenAI로 입체 피규어 생성</button><button id="save" class="secondary" disabled>투명 PNG 저장</button><p id="status" role="status">사진을 선택하세요.</p><small>AI가 원본 사진을 참고해 새로운 피규어 이미지를 생성합니다. 생성에는 OpenAI API 사용료가 발생할 수 있습니다. 이 서비스는 실제 3D 메시(GLB)가 아닌 3D 스타일의 정사각형 이미지입니다.</small></section><section><div class="preview"><img id="result" alt="피규어 미리보기" style="display:none"><span id="empty">사진을 업로드해 주세요.</span></div></section></main><script>const $=s=>document.querySelector(s);let data=null,output=null;$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>8e6){$('#status').textContent='8MB 이하 사진을 선택하세요.';return}data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});$('#result').src=data;$('#result').style.display='block';$('#empty').style.display='none';output=null;$('#save').disabled=true;$('#status').textContent='원본 사진 준비 완료. 피규어 생성 버튼을 누르세요.'};$('#generate').onclick=async()=>{if(!data){$('#status').textContent='먼저 사진을 선택하세요.';return}$('#generate').disabled=true;$('#status').textContent='OpenAI가 입체 피규어를 제작하고 있습니다. 잠시 기다려 주세요…';try{const r=await fetch('/api/figure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:data,style:$('#style').value,base:$('#base').value,name:$('#name').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'생성 실패');output=j.image;$('#result').src=output;$('#save').disabled=false;$('#status').textContent='피규어 이미지 생성 완료! PNG로 저장할 수 있습니다.'}catch(e){$('#status').textContent='생성 실패: '+e.message}finally{$('#generate').disabled=false}};$('#save').onclick=()=>{if(!output)return;const a=document.createElement('a');a.href=output;a.download='myeongdo-ai-figurine.png';a.click()};</script></body></html>
